<!DOCTYPE html>
<html lang="en">

<head>
    <title>404 — Page Not Found | Yash Adake</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="That page doesn't exist. Head back to the portfolio.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0B0E14">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/site.css?v=2.0.0">
    <link rel="icon" type="image/x-icon" href="/photos/nav-brand.png">

    <style>
        .err {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: var(--gutter);
        }

        .err-inner {
            max-width: 32rem;
        }

        .err-code {
            font-family: var(--font-display);
            font-size: clamp(5rem, 22vw, 11rem);
            line-height: 0.9;
            letter-spacing: -0.02em;
        }

        .err-code em {
            font-style: italic;
            color: var(--accent);
        }

        .err-status {
            margin: var(--space-4) 0 var(--space-3);
            color: var(--danger);
        }

        .err-status .status-dot {
            background: var(--danger);
        }

        .err-title {
            font-family: var(--font-display);
            font-size: var(--step-2);
            font-weight: 400;
            margin-bottom: var(--space-3);
        }

        .err-msg {
            color: var(--text-dim);
            margin-bottom: var(--space-6);
        }

        .err-links {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-3);
            justify-content: center;
            margin-top: var(--space-6);
        }

        .err-links a {
            font-family: var(--font-mono);
            font-size: var(--step--1);
            color: var(--text-mute);
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
            transition: color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
        }

        .err-links a:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>

<body>
    <script>try { document.body.classList.toggle('light-mode', localStorage.getItem('theme') === 'light'); } catch (e) { }</script>

    <main class="err">
        <div class="err-inner">
            <p class="err-code">4<em>0</em>4</p>
            <p class="eyebrow err-status"><span class="status"><span class="status-dot"></span></span> resource not found</p>
            <h1 class="err-title">This route doesn't resolve.</h1>
            <p class="err-msg">The page you're after has moved, been retired, or never existed. Let's get you back to something that's live.</p>

            <a href="index.html" class="btn">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 9.5V21h14V9.5"/></svg>
                Back to home
            </a>

            <nav class="err-links" aria-label="Quick links">
                <a href="/#products">Products</a>
                <a href="/#work">Work</a>
                <a href="/#about">About</a>
                <a href="/#writing">Writing</a>
                <a href="/#contact">Contact</a>
            </nav>
        </div>
    </main>
</body>

</html>
